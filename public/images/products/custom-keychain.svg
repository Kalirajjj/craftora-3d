<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="kc-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="metal-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="dual-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#028090"/>
      <stop offset="100%" stop-color="#00a896"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#kc-bg)"/>
  <ellipse cx="400" cy="680" rx="240" ry="45" fill="#000000" opacity="0.65"/>

  <!-- Steel Keyring -->
  <ellipse cx="280" cy="280" rx="90" ry="75" fill="none" stroke="url(#metal-ring)" stroke-width="18"/>
  <ellipse cx="280" cy="280" rx="90" ry="75" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.6"/>

  <!-- 3D Printed Beveled Tag Body -->
  <g transform="rotate(24 400 450)">
    <!-- Base plate -->
    <rect x="220" y="320" width="360" height="150" rx="30" fill="#0f172a" stroke="#334155" stroke-width="4"/>
    <!-- Keyring eyelet -->
    <circle cx="270" cy="395" r="22" fill="#1e293b" stroke="#475569" stroke-width="4"/>
    <circle cx="270" cy="395" r="14" fill="#030712"/>
    <!-- Embossed 3D Dual-Color Lettering -->
    <text x="430" y="415" font-family="'Outfit', 'Segoe UI', sans-serif" font-size="58" font-weight="900" fill="url(#dual-tag)" letter-spacing="4" text-anchor="middle">CRAFTORA</text>
    <!-- Accent layer line -->
    <rect x="330" y="435" width="200" height="6" rx="3" fill="#00a896"/>
  </g>
</svg>