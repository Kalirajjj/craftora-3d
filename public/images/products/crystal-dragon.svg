<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="dragon-bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e182e"/>
      <stop offset="55%" stop-color="#0e0a19"/>
      <stop offset="100%" stop-color="#040208"/>
    </radialGradient>
    <linearGradient id="silk-gold-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="dragon-shadow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="glow-gold">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#dragon-bg)"/>
  
  <!-- Floor shadow following winding snake/dragon body -->
  <ellipse cx="400" cy="680" rx="280" ry="50" fill="#000000" opacity="0.7" filter="url(#dragon-shadow)"/>

  <!-- Articulated S-curved serpentine dragon segments -->
  <g fill="url(#silk-gold-purple)" stroke="#581c87" stroke-width="2">
    <!-- Tail Fin & End -->
    <polygon points="120,640 180,620 160,650 110,660"/>
    <polygon points="170,620 230,600 220,635 160,640"/>
    <!-- Tail segments -->
    <polygon points="220,605 280,575 270,615 210,630"/>
    <polygon points="270,580 340,545 330,590 260,610"/>
    <!-- Mid body wave -->
    <polygon points="330,550 400,530 395,575 320,585"/>
    <polygon points="390,530 470,510 460,560 385,570"/>
    <polygon points="460,515 540,510 535,565 450,560"/>
    <!-- Upper coil curve -->
    <polygon points="530,510 600,480 610,540 530,555"/>
    <polygon points="590,470 630,420 655,470 605,520"/>
    <polygon points="620,410 625,340 660,390 645,450"/>
    <polygon points="610,335 570,275 620,310 645,370"/>
    <!-- Neck -->
    <polygon points="560,275 490,240 540,265 590,310"/>
    <polygon points="480,245 400,230 450,260 520,270"/>

    <!-- Dragon Head & Jaw -->
    <polygon points="390,230 310,210 330,265 410,270" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="310,210 240,225 290,260 330,260"/>
    <!-- Lower Jaw -->
    <polygon points="310,270 260,285 300,310 340,290"/>
    <!-- Glowing Emerald Eye -->
    <circle cx="330" cy="235" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#glow-gold)"/>

    <!-- Crystal Horns & Spikes -->
    <polygon points="380,220 420,120 400,210" fill="#fde047" filter="url(#glow-gold)"/>
    <polygon points="410,210 480,140 430,220" fill="#fde047" filter="url(#glow-gold)"/>
    <polygon points="360,210 365,150 375,215" fill="#fde047"/>

    <!-- Spine Dorsal Crystals running along back -->
    <polygon points="440,230 460,180 470,240" fill="#fde047"/>
    <polygon points="510,250 530,200 540,260" fill="#fde047"/>
    <polygon points="575,290 610,240 595,310" fill="#fde047"/>
    <polygon points="615,360 660,320 635,390" fill="#fde047"/>
    <polygon points="580,480 610,440 590,510" fill="#fde047"/>
    <polygon points="440,520 460,470 450,540" fill="#fde047"/>
    <polygon points="300,560 310,510 320,580" fill="#fde047"/>
  </g>
</svg>