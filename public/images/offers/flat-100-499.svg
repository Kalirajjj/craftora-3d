<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180d2e" />
      <stop offset="45%" stop-color="#241142" />
      <stop offset="100%" stop-color="#3d1466" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(236, 72, 153, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad3)" />
  <rect width="1200" height="380" rx="20" fill="url(#grid3)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1020" cy="190" r="190" fill="#EC4899" opacity="0.22" filter="blur(45px)" />
  <circle cx="200" cy="30" r="130" fill="#A855F7" opacity="0.18" filter="blur(50px)" />

  <!-- Content Group -->
  <g transform="translate(60, 55)">
    <!-- Eyebrow Badge -->
    <rect width="210" height="32" rx="16" fill="rgba(236, 72, 153, 0.2)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" />
    <text x="105" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F472B6" text-anchor="middle" letter-spacing="1.5">⚡ SUPER SAVER OFFER</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Flat ₹100 Discount</text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="url(#goldGrad3)" letter-spacing="-0.5">On Orders Above ₹499</text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="rgba(255, 255, 255, 0.8)">Upgrade your workspace or home with premium 3D planters, lithophanes &amp; decor.</text>

    <!-- Coupon Pill -->
    <g transform="translate(0, 195)">
      <rect width="260" height="48" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="18" y="30" font-family="monospace" font-size="13" fill="#A0AEC0">USE CODE:</text>
      <text x="100" y="31" font-family="monospace" font-size="18" font-weight="800" fill="#F472B6" letter-spacing="2">OFF499</text>
    </g>
  </g>

  <!-- Right Visual Motif -->
  <g transform="translate(900, 70)">
    <polygon points="120,20 210,75 210,185 120,240 30,185 30,75" fill="rgba(236, 72, 153, 0.15)" stroke="url(#purpleGlow)" stroke-width="2.5" />
    <g transform="translate(120, 120)">
      <polygon points="0,-45 52,-15 0,15 -52,-15" fill="#F472B6" opacity="0.9" />
      <polygon points="-52,-15 0,15 0,75 -52,45" fill="#A855F7" opacity="0.95" />
      <polygon points="0,15 52,-15 52,45 0,75" fill="#7C3AED" opacity="0.85" />
    </g>
  </g>
</svg>
