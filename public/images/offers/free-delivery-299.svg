<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="40%" stop-color="#001f3f" />
      <stop offset="100%" stop-color="#003d52" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="20" fill="url(#grid)" />

  <!-- Ambient Glow Circles -->
  <circle cx="1050" cy="190" r="180" fill="#00A896" opacity="0.25" filter="blur(40px)" />
  <circle cx="200" cy="20" r="140" fill="#00F0FF" opacity="0.15" filter="blur(50px)" />

  <!-- Left Content Group -->
  <g transform="translate(60, 55)">
    <!-- Eyebrow Badge -->
    <rect width="210" height="32" rx="16" fill="rgba(0, 168, 150, 0.2)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" />
    <text x="105" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1.5">★ 1ST TIME CUSTOMER PERK</text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Free Priority Delivery</text>
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="url(#goldGrad)" letter-spacing="-0.5">On Orders Above ₹299</text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="rgba(255, 255, 255, 0.8)">Order your first custom 3D printed creation. Safe pan-India packaging &amp; tracking.</text>

    <!-- Coupon Pill -->
    <g transform="translate(0, 195)">
      <rect width="260" height="48" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-dasharray="6,4"/>
      <text x="18" y="30" font-family="monospace" font-size="13" fill="#A0AEC0">USE CODE:</text>
      <text x="100" y="31" font-family="monospace" font-size="18" font-weight="800" fill="#00F0FF" letter-spacing="2">FIRST299</text>
    </g>
  </g>

  <!-- Right Visual Motif: 3D Box & Delivery Symbol -->
  <g transform="translate(900, 70)">
    <!-- Hexagon Outer Shield -->
    <polygon points="120,20 210,75 210,185 120,240 30,185 30,75" fill="rgba(0, 168, 150, 0.15)" stroke="url(#tealGrad)" stroke-width="2.5" />
    
    <!-- 3D Isometric Cube -->
    <g transform="translate(120, 120)">
      <!-- Top Face -->
      <polygon points="0,-45 52,-15 0,15 -52,-15" fill="#00E5FF" opacity="0.9" />
      <!-- Left Face -->
      <polygon points="-52,-15 0,15 0,75 -52,45" fill="#00A896" opacity="0.95" />
      <!-- Right Face -->
      <polygon points="0,15 52,-15 52,45 0,75" fill="#028090" opacity="0.8" />
      <!-- Inner Glow lines -->
      <line x1="0" y1="15" x2="0" y2="75" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />
      <line x1="0" y1="15" x2="-52" y2="-15" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />
      <line x1="0" y1="15" x2="52" y2="-15" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />
    </g>

    <!-- Speed / Fast Delivery Lines -->
    <path d="M-40,80 L-10,80" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M-60,110 L-20,110" stroke="#FFE066" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M-35,140 L-5,140" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    
    <!-- Delivery Truck Tag -->
    <g transform="translate(45, 205)">
      <rect width="150" height="34" rx="17" fill="#00A896" />
      <text x="75" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">⚡ FREE DELIVERY</text>
    </g>
  </g>
</svg>
